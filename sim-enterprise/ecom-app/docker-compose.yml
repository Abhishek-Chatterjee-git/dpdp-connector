services:
  enterprise-ecom:
    build:
      context: ../..
      dockerfile: sim-enterprise/ecom-app/Dockerfile
    container_name: enterprise-ecom-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - ECOM_PORT=3000
      - ADMIN_PORT=3001
      - DB_PATH=/app/data/enterprise_data.sqlite
      - NODE_ENV=production
    volumes:
      - ecom_data:/app/data

volumes:
  ecom_data:
